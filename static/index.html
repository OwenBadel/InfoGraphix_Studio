<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfoGraphix Studio — Generador de Infografías HTML y PowerPoint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-marca">
      <span class="marca-etiqueta">ESTUDIO DUAL</span>
      <h1>InfoGraphix Studio</h1>
    </div>

    <div class="topbar-acciones">
      <label for="select-preset" class="sr-only">Cargar plantilla</label>
      <select id="select-preset" class="control-select" aria-label="Cargar plantilla precargada"></select>
      <button type="button" id="btn-export-html" class="btn btn-secundario">Descargar HTML</button>
      <button type="button" id="btn-export-pptx" class="btn btn-primario">Descargar PowerPoint (.pptx)</button>
    </div>
  </header>

  <div id="estado-banner" class="estado-banner" role="status" aria-live="polite" hidden></div>

  <main class="workspace">
    <aside class="panel-editor" aria-label="Editor de contenido de la infografía">
      <nav class="tabs-nav" role="tablist" aria-label="Secciones del editor">
        <button type="button" class="tab-btn activo" role="tab" aria-selected="true" data-tab="general">General</button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="kpis">KPIs</button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="secciones">Secciones</button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="grafico">Gráfico</button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="hitos">Hitos</button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="json">JSON</button>
      </nav>

      <div class="tab-contenido" id="tab-general" data-panel="general">
        <div class="campo">
          <label for="inp-titulo">Título principal</label>
          <input id="inp-titulo" type="text" maxlength="120">
        </div>
        <div class="campo">
          <label for="inp-subtitulo">Subtítulo</label>
          <textarea id="inp-subtitulo" rows="2" maxlength="240"></textarea>
        </div>
        <div class="fila-dos">
          <div class="campo">
            <label for="inp-categoria">Categoría</label>
            <input id="inp-categoria" type="text" maxlength="50">
          </div>
          <div class="campo">
            <label for="inp-autor">Autor</label>
            <input id="inp-autor" type="text" maxlength="80">
          </div>
        </div>
        <div class="campo">
          <label for="inp-fuente">Fuente / Referencia</label>
          <input id="inp-fuente" type="text" maxlength="140">
        </div>
        <div class="fila-dos">
          <div class="campo">
            <label for="inp-tema">Tema visual (HTML + PPTX)</label>
            <select id="inp-tema"></select>
          </div>
          <div class="campo">
            <label for="inp-plantilla">Plantilla estructural</label>
            <select id="inp-plantilla">
              <option value="ejecutiva">Ejecutiva</option>
              <option value="proceso">Proceso</option>
              <option value="comparativa">Comparativa</option>
              <option value="linea_tiempo">Línea de tiempo</option>
            </select>
          </div>
        </div>
      </div>

      <div class="tab-contenido" id="tab-kpis" data-panel="kpis" hidden>
        <div class="panel-cabecera">
          <h2>Indicadores KPI (máx. 4)</h2>
          <button type="button" id="btn-add-kpi" class="btn btn-pequeno">+ Agregar KPI</button>
        </div>
        <div id="lista-kpis" class="lista-items"></div>
      </div>

      <div class="tab-contenido" id="tab-secciones" data-panel="secciones" hidden>
        <div class="panel-cabecera">
          <h2>Secciones interactivas (1 a 8)</h2>
          <button type="button" id="btn-add-seccion" class="btn btn-pequeno">+ Agregar sección</button>
        </div>
        <div id="lista-secciones" class="lista-items"></div>
      </div>

      <div class="tab-contenido" id="tab-grafico" data-panel="grafico" hidden>
        <div class="panel-cabecera">
          <h2>Gráfico de datos</h2>
          <label class="toggle-inline">
            <input type="checkbox" id="chk-grafico-activo" checked>
            <span>Incluir gráfico</span>
          </label>
        </div>
        <div id="form-grafico-wrap">
          <div class="campo">
            <label for="inp-grafico-titulo">Título del gráfico</label>
            <input id="inp-grafico-titulo" type="text" maxlength="100">
          </div>
          <div class="fila-dos">
            <div class="campo">
              <label for="inp-grafico-tipo">Tipo de gráfico</label>
              <select id="inp-grafico-tipo">
                <option value="barras">Barras verticales</option>
                <option value="dona">Anillo / Dona</option>
                <option value="linea">Línea de tendencia</option>
              </select>
            </div>
            <div class="campo">
              <label for="inp-grafico-unidad">Unidad (ej. %, h, USD)</label>
              <input id="inp-grafico-unidad" type="text" maxlength="16">
            </div>
          </div>
          <div class="campo">
            <label for="inp-grafico-desc">Descripción</label>
            <textarea id="inp-grafico-desc" rows="2" maxlength="260"></textarea>
          </div>
          <div class="panel-cabecera">
            <h3>Puntos de datos</h3>
            <button type="button" id="btn-add-punto" class="btn btn-pequeno">+ Punto</button>
          </div>
          <div id="lista-puntos" class="lista-items"></div>
        </div>
      </div>

      <div class="tab-contenido" id="tab-hitos" data-panel="hitos" hidden>
        <div class="panel-cabecera">
          <h2>Hitos / Línea de tiempo (máx. 6)</h2>
          <button type="button" id="btn-add-hito" class="btn btn-pequeno">+ Agregar hito</button>
        </div>
        <div id="lista-hitos" class="lista-items"></div>
      </div>

      <div class="tab-contenido" id="tab-json" data-panel="json" hidden>
        <div class="panel-cabecera">
          <h2>Esquema JSON</h2>
          <div class="acciones-inline">
            <button type="button" id="btn-aplicar-json" class="btn btn-pequeno">Aplicar JSON</button>
            <button type="button" id="btn-descargar-json" class="btn btn-pequeno">Guardar .json</button>
          </div>
        </div>
        <p class="ayuda-texto">Puedes copiar o pegar una especificación JSON completa para automatizar la generación en HTML y PowerPoint.</p>
        <label for="textarea-json" class="sr-only">Editor JSON</label>
        <textarea id="textarea-json" class="editor-json" rows="18" spellcheck="false"></textarea>
      </div>
    </aside>

    <section class="panel-preview" aria-label="Vista previa interactiva">
      <div class="preview-toolbar">
        <div class="viewport-grupo" role="group" aria-label="Tamaño de vista previa">
          <button type="button" class="btn-vp activo" data-vp="desktop">Escritorio</button>
          <button type="button" class="btn-vp" data-vp="tablet">Tablet</button>
          <button type="button" class="btn-vp" data-vp="mobile">Móvil</button>
        </div>
        <div class="preview-meta">
          <span id="preview-estado" class="badge-estado">Sincronizado</span>
          <button type="button" id="btn-abrir-ventana" class="btn btn-pequeno">Abrir en pestaña</button>
        </div>
      </div>

      <div class="preview-stage" id="preview-stage">
        <iframe id="preview-iframe" title="Vista previa de infografía interactiva HTML" sandbox="allow-scripts allow-modals"></iframe>
      </div>
    </section>
  </main>

  <script src="/static/app.js" defer></script>
</body>
</html>
